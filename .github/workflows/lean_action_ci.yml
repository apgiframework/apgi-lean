name: APGI verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean (lake build --wfail, axiom audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --wfail turns every warning (including `declaration uses sorry`) into a
      # failure. The #guard_msgs axiom audit in Apgi/Pilot.lean raises a hard
      # error on any sorryAx, custom axiom, or change in a theorem's axioms.
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
          use-github-cache: true
      # docgen-action removed until GitHub Pages is configured.

  python:
    name: Registry, consistency, Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SSOT §28.3: Python 3.11 is the reference environment and 3.12 MUST also be tested.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      # Production code under test (E21), pinned to the commit recorded in
      # specification/known-conflicts.json -> production.commit.
      - uses: actions/checkout@v7
        with:
          repository: apgiframework/apgi-implementation
          ref: d153f6a152cb81e05dd1235909f2743e2583ce96
          path: apgi-implementation
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r verification/python/requirements.txt
      # The SSOT-P* behavioural tests (task 53) construct pipeline.APGIPipeline, which imports
      # structlog and pydantic. numpy stays at the verification pin; scipy for optional modules.
      - run: pip install "structlog>=24.1.0,<26.0" "pydantic>=2.0.0,<3.0" "scipy>=1.10.0,<2.0"
      - name: Spec.lean is generated from the current registry
        run: python verification/python/generate_lean.py --check
      - name: Consistency check (fails on unacknowledged or stale conflicts)
        run: python verification/python/check_consistency.py
      - name: Traceability matrix and assumption inventory are generated from the current registry
        run: python verification/python/make_traceability.py --check
      - name: Pytest (twins, golden vectors, seeded conflicts, production cross-check)
        working-directory: verification/python
        env:
          APGI_IMPL_PATH: ${{ github.workspace }}/apgi-implementation
        run: python -m pytest -q -rxs --junitxml=../reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python }}
          path: verification/reports/junit.xml

  production-validation:
    # Second production package (task 19/36): apgi_core in apgi-validation, pinned
    # to known-conflicts.json -> production_secondary.commit. Runs in its own job
    # because both production repositories ship a top-level 'utils' package.
    name: apgi-validation cross-check (apgi_core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: apgiframework/apgi-validation
          ref: f6fec658727f105c4735717ae30c9132f02d8988
          path: apgi-validation
      # Same interpreter and lock file as apgi-validation's own CI: unpinned on
      # 3.12 its requirements pull a pytensor that does not build.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r apgi-validation/requirements.txt -c apgi-validation/requirements.lock
      - run: pip install pytest hypothesis mpmath -c apgi-validation/requirements.lock
      - name: Pytest (strict xfail on every open PV-* divergence)
        working-directory: verification/python
        env:
          APGI_VALIDATION_PATH: ${{ github.workspace }}/apgi-validation
        run: python -m pytest -q -rxs -p no:cacheprovider test_production_validation.py

  report:
    name: Verification report
    needs: [lean, python, production-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r verification/python/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: junit-3.12
          path: verification/reports
        continue-on-error: true
      - name: Build report
        run: >
          python verification/python/make_report.py
          --junit verification/reports/junit.xml
          ${{ needs.lean.result == 'success' && '--lean-ok' || '--lean-log failed' }}
      - run: cat verification/reports/verification-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification/reports/
      - name: Fail if Lean or Python failed
        if: needs.lean.result != 'success' || needs.python.result != 'success' || needs.production-validation.result != 'success'
        run: exit 1
